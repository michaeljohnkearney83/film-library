# MediaHub login theme: the realm's default. Keycloak's keycloak.v2 (PatternFly 5) with a neutral, clean card layout.
# App themes (e.g. filmlibrary) extend this one and only change colours and the logo.
parent=keycloak.v2
import=common/keycloak

# Keep the parent's stylesheet (resolved from keycloak.v2) and add ours on top.
styles=css/styles.css css/mediahub.css

darkMode=false
