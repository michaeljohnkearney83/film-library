# Film Library login theme: the MediaHub base theme with Film Library's colours and logo.
# Used only when signing in to Film Library (client attribute login_theme=filmlibrary in the realm).
parent=mediahub
import=common/keycloak

# Parent stylesheets resolve from mediahub/keycloak.v2; ours goes last so it wins.
styles=css/styles.css css/mediahub.css css/filmlibrary.css

darkMode=false
