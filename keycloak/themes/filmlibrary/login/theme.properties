# Film Library login theme: Keycloak's keycloak.v2 (PatternFly 5) with the app's colours and logo.
parent=keycloak.v2
import=common/keycloak

# Keep the parent's stylesheet (resolved from keycloak.v2) and add ours on top.
styles=css/styles.css css/filmlibrary.css

# The app follows the OS colour scheme; this theme sticks to the light palette for now.
darkMode=false
