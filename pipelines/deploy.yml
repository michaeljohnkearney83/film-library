# Deploys one environment: infrastructure, then the API, then the React app with that environment's config.json.
# Needs a variable group named filmlibrary-<environment> (see pipelines/README.md).

parameters:
  - name: environment
    type: string
    values: [dev, uat, prod]
  - name: serviceConnection
    type: string
  - name: location
    type: string
    default: uksouth

jobs:
  - deployment: Deploy
    displayName: Deploy ${{ parameters.environment }}
    pool: { vmImage: ubuntu-latest }
    environment: filmlibrary-${{ parameters.environment }} # approvals and checks are configured here
    variables:
      - group: filmlibrary-${{ parameters.environment }}
      - name: resourceGroup
        value: rg-filmlib-${{ parameters.environment }}
    strategy:
      runOnce:
        deploy:
          steps:
            # Deployment jobs download all artifacts (api, web, infra) to $(Pipeline.Workspace).

            - task: AzureCLI@2
              name: infra
              displayName: Deploy infrastructure (Bicep)
              inputs:
                azureSubscription: ${{ parameters.serviceConnection }}
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  set -euo pipefail
                  az group create --name "$(resourceGroup)" --location "${{ parameters.location }}" \
                    --tags app=film-library environment=${{ parameters.environment }} --output none
                  outputs=$(az deployment group create \
                    --resource-group "$(resourceGroup)" \
                    --name "filmlibrary-$(Build.BuildId)" \
                    --parameters "$(Pipeline.Workspace)/infra/env/${{ parameters.environment }}.bicepparam" \
                    --query properties.outputs --output json)
                  for name in apiName apiUrl staticWebAppName webUrl appInsightsConnectionString; do
                    echo "##vso[task.setvariable variable=$name]$(echo "$outputs" | jq -r ".$name.value")"
                  done
              # ALERT_EMAIL (optional) reaches the script on its own: non-secret variables become environment variables.
              env:
                ENTRA_AUTHORITY: $(ENTRA_AUTHORITY)
                ENTRA_API_CLIENT_ID: $(ENTRA_API_CLIENT_ID)

            - task: AzureWebApp@1
              displayName: Deploy API
              inputs:
                azureSubscription: ${{ parameters.serviceConnection }}
                appType: webAppLinux
                appName: $(apiName)
                package: $(Pipeline.Workspace)/api/api.zip

            # Ready means the API has started and can read from Cosmos DB with its managed identity.
            - script: |
                set -euo pipefail
                for i in $(seq 1 30); do
                  curl -sf "$(apiUrl)/healthz/ready" && exit 0
                  sleep 10
                done
                echo "API readiness check failed"; exit 1
              displayName: Wait until the API is ready

            # The React app and the API share one OpenID Connect authority (ENTRA_AUTHORITY).
            # offline_access gets a refresh token, so the app can renew access tokens without a redirect.
            # telemetry sends the browser's page views, exceptions and API calls to the same Application Insights.
            - script: |
                cat > "$(Pipeline.Workspace)/web/config.json" <<EOF
                {
                  "apiBaseUrl": "$(apiUrl)",
                  "auth": {
                    "authority": "$(ENTRA_AUTHORITY)",
                    "clientId": "$(ENTRA_SPA_CLIENT_ID)",
                    "scope": "offline_access $(ENTRA_API_SCOPE)"
                  },
                  "telemetry": {
                    "connectionString": "$(appInsightsConnectionString)"
                  }
                }
                EOF
                jq -e . "$(Pipeline.Workspace)/web/config.json" > /dev/null # fail here, not in the browser, if it isn't valid JSON
              displayName: Write the React app's config.json

            - task: AzureCLI@2
              displayName: Get Static Web App deployment token
              inputs:
                azureSubscription: ${{ parameters.serviceConnection }}
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  token=$(az staticwebapp secrets list --name "$(staticWebAppName)" --resource-group "$(resourceGroup)" --query properties.apiKey --output tsv)
                  echo "##vso[task.setvariable variable=swaToken;issecret=true]$token"

            - task: AzureStaticWebApp@0
              displayName: Deploy React app
              inputs:
                cwd: $(Pipeline.Workspace)/web
                app_location: /
                skip_app_build: true
                azure_static_web_apps_api_token: $(swaToken)

            - script: echo "Web $(webUrl)  API $(apiUrl)"
              displayName: Deployed URLs
